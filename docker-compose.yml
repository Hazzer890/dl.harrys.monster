services:
  dl:
    build: .
    restart: unless-stopped
    volumes:
      - ./secrets:/secrets
    networks:
      dl-edge:
        aliases: [dl]
# Own network shared only with Caddy, so dl can't reach the other apps; ops/egress.sh
# firewalls it off from private and metadata addresses. Create once:
#   docker network create --subnet 172.30.0.0/24 dl-edge
networks:
  dl-edge:
    external: true
